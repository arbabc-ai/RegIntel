<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegIntel</title>
<meta name="description" content="Citation-grounded answers over Federal Reserve regulations, or an explicit refusal.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181f; --muted: #5d6675; --line: #dde1e8;
    --accent: #1f5fd6; --accent-ink: #fff; --warn-bg: #fff6e0; --warn-line: #e9c46a; --chip: #e8effc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --ink: #e8ebf0; --muted: #98a1b0; --line: #2a303c;
      --accent: #5b8def; --accent-ink: #0b0e14; --warn-bg: #2a2412; --warn-line: #7a6320; --chip: #1e2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.15rem; }
  header span { color: var(--muted); font-size: .9rem; }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap: 16px;
    padding: 16px; max-width: 1400px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    min-height: 60vh; }
  h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  textarea { width: 100%; min-height: 150px; resize: vertical; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; }
  #go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 18px; font-weight: 600; }
  #go[disabled] { opacity: .55; cursor: progress; }
  .count { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .examples { margin-top: 16px; }
  .examples button { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .examples button:hover { border-color: var(--accent); }
  .disclaimer { margin-top: 16px; font-size: .85rem; color: var(--muted); }
  #answer .text { white-space: pre-wrap; }
  .refusal { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 12px; }
  .cite { display: inline-block; background: var(--chip); color: var(--accent); border: 0; border-radius: 5px;
    padding: 0 6px; font-size: .85em; cursor: pointer; }
  .sources { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .src { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: .92rem; }
  .src.hl { border-color: var(--accent); box-shadow: 0 0 0 2px var(--chip); }
  .src b { display: block; }
  .src small { color: var(--muted); }
  .empty { color: var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 12px; } section { min-height: 0; } }
</style>
</head>
<body>
<header>
  <h1>RegIntel</h1>
  <span>Federal Reserve regulations (12 CFR Chapter II) &mdash; cited answers, or a refusal.</span>
</header>
<main>
  <section aria-labelledby="qh">
    <h2 id="qh">Question</h2>
    <textarea id="q" maxlength="500" placeholder="e.g. What is the minimum CET1 capital ratio under Regulation Q?"></textarea>
    <div class="row">
      <button id="go" type="button">Ask</button>
      <span class="count"><span id="n">0</span>/500</span>
    </div>
    <div class="examples">
      <h2>Try</h2>
      <button type="button" data-q="What is the minimum common equity tier 1 capital ratio?">What is the minimum common equity tier 1 capital ratio?</button>
      <button type="button" data-q="Which institutions must meet the liquidity coverage ratio?">Which institutions must meet the liquidity coverage ratio?</button>
      <button type="button" data-q="What are the reserve requirement ratios for depository institutions?">What are the reserve requirement ratios for depository institutions?</button>
    </div>
    <p class="disclaimer">Research aid over public regulatory text. Not legal or compliance advice; verify against the
      current eCFR before relying on any answer.</p>
  </section>
  <section aria-labelledby="ah" aria-live="polite">
    <h2 id="ah">Answer</h2>
    <div id="answer"><p class="empty">Ask a question to see a cited answer here.</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const q = $("q"), go = $("go"), out = $("answer");

q.addEventListener("input", () => { $("n").textContent = q.value.length; });
document.querySelectorAll(".examples button").forEach((b) =>
  b.addEventListener("click", () => { q.value = b.dataset.q; q.dispatchEvent(new Event("input")); ask(); }));
go.addEventListener("click", ask);
q.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });

// All model/regulation text is inserted via textContent, never innerHTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderAnswer(text) {
  const box = el("div", "text");
  text.split(/(\[\d+\])/g).forEach((part) => {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) {
      const c = el("button", "cite", part);
      c.type = "button";
      c.addEventListener("click", () => highlight(m[1]));
      box.append(c);
    } else box.append(document.createTextNode(part));
  });
  return box;
}

function highlight(n) {
  document.querySelectorAll(".src").forEach((s) => s.classList.toggle("hl", s.dataset.n === n));
  const t = document.querySelector('.src[data-n="' + n + '"]');
  if (t) t.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function render(data) {
  out.replaceChildren();
  if (data.error) { out.append(el("div", "refusal", "Error: " + data.error)); return; }
  if (data.refused) {
    out.append(el("div", "refusal", data.answer));
  } else {
    out.append(renderAnswer(data.answer));
  }
  if (data.sources && data.sources.length) {
    const wrap = el("div", "sources");
    wrap.append(el("h2", null, data.refused ? "Closest passages (not sufficient to answer)" : "Sources"));
    data.sources.forEach((s) => {
      const d = el("div", "src");
      d.dataset.n = String(s.n);
      d.append(el("b", null, "[" + s.n + "] " + s.source));
      d.append(el("small", null, s.title));
      d.append(el("div", null, s.text));
      wrap.append(d);
    });
    out.append(wrap);
  }
}

async function ask() {
  const question = q.value.trim();
  if (question.length < 5) return;
  go.disabled = true; go.textContent = "Thinking…";
  out.replaceChildren(el("p", "empty", "Searching regulations…"));
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question }) });
    render(await r.json());
  } catch {
    render({ error: "could not reach the service" });
  } finally {
    go.disabled = false; go.textContent = "Ask";
  }
}
</script>
</body>
</html>
