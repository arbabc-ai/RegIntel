[project]
name = "regintel"
version = "0.1.0"
description = "RegIntel — citation-grounded RAG over banking & financial regulation (Basel III/LCR, FFIEC, OCC), AWS Bedrock-native"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "boto3>=1.35.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-text-splitters>=0.3.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "scripts", "eval"]
